[package]
name = "muxdeck-engine"
description = "MuxDeck engine library: TLS WebSocket server, pairing, auth, store, mDNS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.0"
directories = "6.0.0"
ed25519-dalek = "3.0.0"
futures-util = "0.3.33"
getrandom = "0.4.3"
if-addrs = "0.15.0"
mdns-sd = "0.20.3"
muxdeck-core.workspace = true
muxdeck-input.workspace = true
rcgen = "0.14.8"
rustls = { version = "0.23.43", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"

[dev-dependencies]
rustls = { version = "0.23.43", features = ["ring"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
