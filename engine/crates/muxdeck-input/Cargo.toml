[package]
name = "muxdeck-input"
description = "Input injection backends for MuxDeck: Windows, macOS and Linux behind one trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
muxdeck-core = { version = "0.1.0", path = "../muxdeck-core" }
thiserror = "2.0.19"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

# Platform backends land in M3 (Windows) and M7 (macOS, Linux). Their dependencies are
# listed in docs/ENGINE.md §3 and go behind [target.'cfg(target_os = "...")'.dependencies]
# so a Linux build never pulls the Windows crate.

[features]
# Exposes `mock::MockBackend` to other crates' test suites. Never enabled by a normal build.
mock = []
