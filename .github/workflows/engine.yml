name: engine

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'protocol/fixtures/**'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'protocol/fixtures/**'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: engine

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No toolchain action: engine/rust-toolchain.toml pins the version and the
      # rustfmt/clippy components, and rustup honours it automatically. Installing a
      # toolchain here as well would just mask a drift between CI and the dev machine.
      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The uinput tests are #[ignore]d because they need write access to /dev/uinput, which no
      # ordinary machine grants. A Linux runner can, and this is the only automated proof that
      # the Linux backend emits the right key codes in the right order rather than merely
      # compiling. Chmod rather than `usermod -aG input`, which needs a fresh login to take.
      - name: Test uinput injection
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo modprobe uinput
          sudo chmod 0666 /dev/uinput
          cargo test -p muxdeck-input -- --ignored --test-threads=1
