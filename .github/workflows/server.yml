name: server

# The desktop control panel. Targets Windows, macOS and Linux — never web and never
# mobile. Analyze and test only: the release builds for all three platforms, and the Linux
# libayatana-appindicator3 dependency the tray icon needs, live in release.yml so that a
# pull request does not pay for three desktop compiles.

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/muxdeck_protocol/**'
      - 'protocol/fixtures/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'packages/muxdeck_protocol/**'
      - 'protocol/fixtures/**'
      - '.github/workflows/server.yml'

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/server

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Matches protocol.yml. Without it, formatting drifts here unnoticed and only surfaces
      # when a file moves into a package whose CI does check.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
